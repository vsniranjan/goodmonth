services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: goodmonth
      POSTGRES_USER: goodmonth
      POSTGRES_PASSWORD: local-goodmonth-only
    ports:
      - "5432:5432"
    volumes:
      - goodmonth_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goodmonth -d goodmonth"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  goodmonth_pg:
